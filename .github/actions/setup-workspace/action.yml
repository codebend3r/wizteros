name: Set up workspace
description: Install the pinned runtimes and frozen workspace dependencies
runs:
  using: composite
  steps:
    - name: 🟢 Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
    # setup-bun reads packageManager; do not duplicate the Bun pin here.
    - name: 🥟 Set up Bun
      uses: oven-sh/setup-bun@v2
    - name: ♻️ Restore Bun downloads
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-
    - name: 📦 Install workspace dependencies
      shell: bash
      env:
        LEFTHOOK: '0'
      run: bun install --frozen-lockfile
