name: 🧪 Pull request checks

# PRs only. Merges to main are checked by main-checks.yml, which never cancels.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Two runners in parallel, then the verdict. Each job holds one of the
# account's concurrent job slots, so few, busy jobs keep simultaneous PRs
# from queueing behind each other.
jobs:
  checks:
    name: 🔍 Checks
    uses: ./.github/workflows/checks.yml
    with:
      affected-only: true
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

  images:
    name: 🐳 Containers
    uses: ./.github/workflows/sanity-check.yml

  # Keep the existing required-check name stable. An always-running verdict
  # fails closed on failure, cancellation OR an unexpectedly skipped lane.
  pull-request-checks:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [checks, images]
    if: always()
    steps:
      - name: 📝 Check every lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
