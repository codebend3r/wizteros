name: 🧪 Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  repository:
    name: 🔎 Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: 🔍 Lint root (oxlint)
        run: bun run lint:root
      - name: 💅 Check root formatting (oxfmt)
        run: bun run format:check:root
      - name: 🧪 Test repository tooling
        run: bun run test:tooling
      - name: 🔢 Check version parity
        run: bun run check:versions
      - name: 🔐 Scan for secrets and private infrastructure details
        run: bun run security:scan
      - name: 🔎 Lint workflows and embedded shell
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck scripts/ci/*.sh
      # Existing high advisories need a separate dependency-remediation change.
      # Report them visibly without turning this CI-only change permanently red.
      - name: 🛡️ Report dependency vulnerabilities
        id: audit
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: ⚠️ Surface dependency findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::Dependency audit failed; see the audit step for advisories or registry errors."
          echo '⚠️ Dependency audit failed (advisories or registry error); this report is not yet a blocking gate.' >> "$GITHUB_STEP_SUMMARY"

  workspace:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_BASE: ${{ github.event.pull_request.base.sha }}
      NX_HEAD: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 🔍 Static checks
            cache: static
            targets: lint:ts lint:css format:check typecheck
          - lane: 🧪 Tests
            cache: tests
            targets: test
          - lane: 🏗️ Production builds
            cache: builds
            targets: build
    steps:
      - name: 📥 Checkout merge result and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Separate lanes must not race to save different task sets to the same key.
      - name: ♻️ Restore Nx task cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-${{ hashFiles('bun.lock', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            nx-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-${{ hashFiles('bun.lock', '.node-version') }}-
      # Compare the synthetic merge commit, not just the PR head. Full main
      # runs seed caches and catch anything an affected-project calculation misses.
      - name: 🚀 Run independent Nx targets concurrently
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a targets <<< "$TARGETS"
          if [ "$EVENT_NAME" = pull_request ]; then
            bunx nx affected -t "${targets[@]}" --parallel=3 --outputStyle=static
          else
            bunx nx run-many -t "${targets[@]}" --parallel=3 --outputStyle=static
          fi
      - name: 🕵️ Verify web build output when built
        if: matrix.cache == 'builds'
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            projects="$(bunx nx show projects --affected --json)"
          else
            projects='["admin-portal"]'
          fi
          if printf '%s\n' "$projects" | jq -e 'index("admin-portal") != null' >/dev/null; then
            test -s apps/admin-portal/dist/index.html
          fi

  images:
    name: 🐳 Container checks
    uses: ./.github/workflows/sanity-check.yml

  # Keep the existing required-check name stable. An always-running verdict
  # fails closed on failure, cancellation OR an unexpectedly skipped lane.
  pull-request-checks:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [repository, workspace, images]
    if: always()
    steps:
      - name: 📝 Check every lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
