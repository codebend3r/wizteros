name: 🧪 Pull request checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch;
# runs on different branches never interfere with each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pull-request-checks:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the runtime image (apps/stripe-bridge/Dockerfile: python:3.12-slim).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/*/requirements*.txt

      - name: 📦 Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: 📦 Install bridge dependencies
        run: pip install -r apps/stripe-bridge/requirements.txt -r apps/stripe-bridge/requirements-dev.txt

      # httpx and pytest-asyncio are the two that matter: TestClient needs the
      # first, and without the second `asyncio_mode = auto` is an unrecognized
      # ini key and every async test is skipped rather than failed.
      - name: 📦 Install fleet monitor dependencies
        run: pip install -r apps/fleet-monitor/requirements.txt -r apps/fleet-monitor/requirements-dev.txt

      - name: ♻️ Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-${{ runner.os }}-

      # The checks `bun run verify` bundles locally, split one target per step so
      # a red run names the failure in the job list instead of burying it. Nx
      # caches across steps, so the split costs one process per target, not one
      # rerun. Colon targets go through `run-many`, since `nx run <p>:lint:css`
      # would read the second colon as a configuration name.

      # Everything outside apps/ is not an Nx project, so its oxlint and oxfmt
      # pass is a plain script and `run-many` below would never reach it.
      - name: 🔍 Lint root (oxlint)
        run: bun run lint:root

      - name: 💅 Check root formatting (oxfmt)
        run: bun run format:check:root

      - name: 🔍 Lint TS/JS (oxlint)
        run: bunx nx run-many -t lint:ts

      - name: 🎨 Lint SCSS (stylelint)
        run: bunx nx run-many -t lint:css

      - name: 🧹 Lint Python (ruff)
        run: bunx nx run-many -t lint:py

      - name: 💅 Check formatting (oxfmt)
        run: bunx nx run-many -t format:check

      - name: 🧬 Typecheck (tsgo)
        run: bunx nx run-many -t typecheck

      - name: 🧪 Test (bun + pytest)
        run: bunx nx run-many -t test
