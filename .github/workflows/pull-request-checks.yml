name: 🧪 Pull request checks

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch;
# runs on different branches never interfere with each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pull-request-checks:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # No bun-version input on purpose: setup-bun reads `packageManager` from
      # the root package.json, so the pin lives in one place.
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2

      # The NestJS servers run on Node (their images are node:24-slim), and
      # Vitest and the Nest CLI run under it here too. .node-version is the pin.
      - name: 🟢 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 📦 Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: ♻️ Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-${{ runner.os }}-

      # The checks `bun run verify` bundles locally, split one target per step so
      # a red run names the failure in the job list instead of burying it. Nx
      # caches across steps, so the split costs one process per target, not one
      # rerun. Colon targets go through `run-many`, since `nx run <p>:lint:css`
      # would read the second colon as a configuration name.

      # Everything outside apps/ is not an Nx project, so its oxlint and oxfmt
      # pass is a plain script and `run-many` below would never reach it.
      - name: 🔍 Lint root (oxlint)
        run: bun run lint:root

      - name: 💅 Check root formatting (oxfmt)
        run: bun run format:check:root

      - name: 🔍 Lint TS/JS (oxlint)
        run: bunx nx run-many -t lint:ts

      - name: 🎨 Lint SCSS (stylelint)
        run: bunx nx run-many -t lint:css

      - name: 💅 Check formatting (oxfmt)
        run: bunx nx run-many -t format:check

      - name: 🧬 Typecheck (tsgo)
        run: bunx nx run-many -t typecheck

      - name: 🧪 Test (bun + vitest)
        run: bunx nx run-many -t test

      # `nest build` is where the `@/` alias gets rewritten for Node, so a
      # server that typechecks can still fail here.
      - name: 🏗️ Build
        run: bunx nx run-many -t build
