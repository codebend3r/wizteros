name: CI

on:
  push:
    branches: ['**']

# A newer push to the same branch cancels the in-flight run for that branch;
# runs on different branches never interfere with each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the runtime image (apps/stripe-bridge/Dockerfile: python:3.12-slim).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/stripe-bridge/requirements*.txt

      - name: 📦 Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: 📦 Install bridge dependencies
        run: pip install -r apps/stripe-bridge/requirements.txt -r apps/stripe-bridge/requirements-dev.txt

      - name: ♻️ Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-${{ runner.os }}-

      # One graph, one command: oxlint + gale + oxfmt + tsgo + bun test for
      # admin-portal, pytest for stripe-bridge. Same as `bun run verify` locally.
      - name: ✅ Lint, format, typecheck, test
        run: bun run verify
