name: CI

on:
  push:
    branches: ['**']

# A newer push to the same branch cancels the in-flight run for that branch;
# runs on different branches never interfere with each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔍 Lint TS/JS (oxlint)
        run: bun run lint
      - name: 🎨 Lint SCSS (gale)
        run: bun run lint:css
      - name: 💅 Check formatting (oxfmt)
        run: bun run format:check
      - name: 🧬 Typecheck (tsgo)
        run: bun run typecheck
      - name: 🧪 Test (bun)
        run: bun run test

  bridge:
    name: Stripe bridge checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stripe-bridge
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the runtime image (stripe-bridge/Dockerfile: python:3.12-slim).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stripe-bridge/requirements*.txt
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 🔍 Lint (ruff)
        run: python -m ruff check .
      - name: 🧪 Test (pytest)
        run: python -m pytest -q
