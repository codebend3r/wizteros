name: ✅ Sanity check

on:
  push:
    branches: [main]

jobs:
  # CI already lints/typechecks/tests. This job covers the one thing it doesn't:
  # the production bundle Netlify actually ships.
  web-build:
    name: 🏗️ Web production build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      # No bun-version input on purpose: setup-bun reads `packageManager` from
      # the root package.json, so the pin lives in one place.
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build (Nx + Vite)
        run: bun run build
      - name: 🕵️ Verify build output
        run: |
          test -s apps/admin-portal/dist/index.html || { echo "::error::💥 apps/admin-portal/dist/index.html is missing or empty"; exit 1; }
          echo "✅ Bundle looks sane — $(du -sh apps/admin-portal/dist | cut -f1) across $(find apps/admin-portal/dist -type f | wc -l | tr -d ' ') files"

  # Proves the bridge image still builds and the server boots and answers: a
  # broken import or a missing env check only shows up at container start,
  # long after the merge. Built from the repo root, as compose builds it.
  bridge-image:
    name: 🐳 Bridge image + boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐳 Build image
        run: docker build -f apps/stripe-bridge/Dockerfile -t stripe-bridge:sanity .
      - name: 🚦 Smoke test the server
        run: |
          docker run -d --name bridge-sanity -p 8000:8000 \
            -e STRIPE_API_KEY=sk_test_sanity \
            -e STRIPE_WEBHOOK_SECRET=whsec_sanity \
            -e WIZARR_BASE_URL=http://wizarr.invalid \
            -e WIZARR_API_KEY=sanity \
            -e PUBLIC_INVITE_BASE=http://invite.invalid \
            -e SMTP_HOST=smtp.invalid \
            -e SMTP_PORT=587 \
            -e SMTP_USER=sanity \
            -e SMTP_PASS=sanity \
            -e FROM_ADDR=sanity@invalid \
            -e MAP_DB_PATH=/tmp/sanity.db \
            stripe-bridge:sanity
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/version >/dev/null && break
            sleep 1
          done
          expect() {
            got="$(curl -s -o /dev/null -w '%{http_code}' "${@:2}")"
            if [ "$got" != "$1" ]; then
              echo "::error::💥 ${*:2} answered $got, expected $1"
              docker logs bridge-sanity
              exit 1
            fi
            echo "✅ ${*: -1} -> $got"
          }
          expect 200 http://localhost:8000/version
          expect 200 http://localhost:8000/stripe/version
          expect 401 http://localhost:8000/admin/members
          expect 400 -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8000/webhook
          expect 400 -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8000/stripe/webhook
          echo "✅ The server boots and both Stripe webhook routes are wired up"

  # The Netlify build and the release tag both read these; drift means a shipped
  # bundle reporting the wrong version.
  versions:
    name: 🔢 Version parity
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🧮 Compare root, admin portal and bridge versions
        run: |
          root=$(node -p "require('./package.json').version")
          portal=$(node -p "require('./apps/admin-portal/package.json').version")
          bridge=$(node -p "require('./apps/stripe-bridge/package.json').version")
          echo "📦 root=$root  🌐 admin-portal=$portal  🌉 stripe-bridge=$bridge"
          if [ "$root" != "$portal" ]; then
            echo "::error::💥 Version drift — root is $root but apps/admin-portal/ is $portal"
            exit 1
          fi
          if [ "$root" != "$bridge" ]; then
            echo "::error::💥 Version drift — root is $root but apps/stripe-bridge/ is $bridge"
            exit 1
          fi
          echo "✅ All three markers agree on v$root"

  summary:
    name: 🎉 Sanity verdict
    runs-on: ubuntu-latest
    needs: [web-build, bridge-image, versions]
    # Runs even when a check fails so the summary reports the failure too.
    if: always()
    steps:
      - name: 📝 Write summary
        run: |
          {
            echo "## 🩺 Sanity check"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| 🏗️ Web production build | ${{ needs.web-build.result == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🐳 Bridge image + boot smoke | ${{ needs.bridge-image.result == 'success' && '✅ passed' || '❌ failed' }} |"
            echo "| 🔢 Version parity | ${{ needs.versions.result == 'success' && '✅ passed' || '❌ failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 🚨 Fail if anything broke
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::🔥 Something broke on main — check the failed job above"
          exit 1
      - name: 🎊 All clear
        run: echo "🚀 main is healthy — ship it!"
