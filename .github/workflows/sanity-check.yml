name: ✅ Container sanity check

# Called by the PR/main workflow so image failures are part of its verdict,
# rather than discovering a broken production image only after merging.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: 🐳 ${{ matrix.app }} image + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [stripe-bridge, fleet-monitor]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build and load image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: ${{ matrix.app }}:sanity
          cache-from: type=gha,scope=${{ matrix.app }}
          # Only trusted main runs publish shared layers; PRs can consume them.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=max', matrix.app) || '' }}
      - name: 🚦 Smoke test the production image
        env:
          APP: ${{ matrix.app }}
        run: bash scripts/ci/smoke-container.sh "$APP"
