name: ✅ Container sanity check

# Called by the PR and main workflows so image failures are part of their verdict,
# rather than discovering a broken production image only after merging. One
# bake builds both images concurrently on one runner, then both boot at once.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  images:
    name: 🐳 Images + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build and load both images
        uses: docker/bake-action@v7
        env:
          # Only trusted main runs publish shared layers; PRs can consume them.
          PUBLISH_CACHE: ${{ github.event_name == 'push' && 'true' || '' }}
        with:
          source: .
          files: .github/ci/images.hcl
      # The two containers use different names and ports, so they boot side by side.
      - name: 🚦 Smoke test both production images
        run: |
          bash scripts/ci/run-parallel.sh \
            "stripe-bridge=bash scripts/ci/smoke-container.sh stripe-bridge" \
            "fleet-monitor=bash scripts/ci/smoke-container.sh fleet-monitor"
