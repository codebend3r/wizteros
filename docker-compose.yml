name: stripe-bridge

services:
  stripe-bridge:
    build: ./apps/stripe-bridge
    image: wizteros-stripe-bridge
    container_name: stripe-bridge
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - ./stripe-bridge-data:/data

  # Wizarr and Tautulli live in the NAS-side "westeroz" project
  # (/volume1/docker/westeroz/docker-compose.yml), so the bridge reaches Wizarr
  # through its host-published port (WIZARR_BASE_URL in .env), not container DNS.
  # Public ingress is handled by Tailscale Funnel running on the NAS host
  # (Synology package), not a container. It serves the host-published ports
  # 5690 (wizarr) and 8000 (stripe-bridge) at https://<node>.<tailnet>.ts.net.
  # See docs/tailscale-funnel.md.
