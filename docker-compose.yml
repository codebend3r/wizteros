services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    restart: unless-stopped
    ports:
      - "5690:5690"
    volumes:
      - ./wizarr-data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/New_York}
      - DISABLE_BUILTIN_AUTH=false

  tautulli:
    image: ghcr.io/tautulli/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ./tautulli-config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/New_York}

  stripe-bridge:
    build: ./stripe-bridge
    container_name: stripe-bridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./stripe-bridge-data:/data
    depends_on:
      - wizarr
